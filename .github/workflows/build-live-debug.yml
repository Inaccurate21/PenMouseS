name: Build Live test APK

on:
  push:
    branches: [realtime-drag]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Test gesture state machine and build standalone debug APK
        run: bash ./gradlew :mousemode:mouse:testDebugUnitTest :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PenMouseS-Live-test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesture-test-results
          path: mousemode/mouse/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
